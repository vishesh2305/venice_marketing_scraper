<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venice AI Marketing Scraper - 5 Intelligent Agents</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --border: #2a2a3a;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-primary: #f1f1f3;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --hot: #ef4444;
            --warm: #f59e0b;
            --cold: #3b82f6;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Background grid pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }
        
        #root {
            position: relative;
            z-index: 1;
        }
        
        /* Animations */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px var(--accent-glow); }
            50% { box-shadow: 0 0 40px var(--accent-glow), 0 0 60px var(--accent-glow); }
        }
        
        @keyframes slide-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes progress-pulse {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        
        .animate-in {
            animation: slide-up 0.5s ease forwards;
        }
        
        .stagger-1 { animation-delay: 0.1s; opacity: 0; }
        .stagger-2 { animation-delay: 0.2s; opacity: 0; }
        .stagger-3 { animation-delay: 0.3s; opacity: 0; }
        .stagger-4 { animation-delay: 0.4s; opacity: 0; }
        .stagger-5 { animation-delay: 0.5s; opacity: 0; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // Agent Icons as SVG components
        const AgentIcon = ({ type }) => {
            const icons = {
                keyword: (
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                        <path d="M11 8v6M8 11h6"/>
                    </svg>
                ),
                domain: (
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                ),
                hunter: (
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                        <circle cx="12" cy="12" r="10"/>
                        <circle cx="12" cy="12" r="6"/>
                        <circle cx="12" cy="12" r="2"/>
                    </svg>
                ),
                enrichment: (
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                        <path d="M3 3v18h18"/>
                        <path d="M18 17V9"/>
                        <path d="M13 17V5"/>
                        <path d="M8 17v-3"/>
                    </svg>
                ),
                export: (
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                )
            };
            return <span style={{width: 24, height: 24, display: 'block'}}>{icons[type]}</span>;
        };
        
        // Agent definitions
        const AGENTS = [
            { id: 1, key: 'keyword', name: 'Keyword Intelligence', model: 'zai-org-glm-4.6', color: '#8b5cf6' },
            { id: 2, key: 'domain', name: 'Domain Scanner', model: 'llama-3.3-70b', color: '#06b6d4' },
            { id: 3, key: 'hunter', name: 'Profile Hunter', model: 'qwen3-235b', color: '#f59e0b' },
            { id: 4, key: 'enrichment', name: 'Data Enrichment', model: 'zai-org-glm-4.6', color: '#10b981' },
            { id: 5, key: 'export', name: 'Export Master', model: 'llama-3.3-70b', color: '#ef4444' }
        ];
        
        // Header Component
        const Header = () => (
            <header style={{
                padding: '24px 48px',
                borderBottom: '1px solid var(--border)',
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
                backdropFilter: 'blur(10px)',
                background: 'rgba(10, 10, 15, 0.8)',
                position: 'sticky',
                top: 0,
                zIndex: 100
            }}>
                <div style={{display: 'flex', alignItems: 'center', gap: 16}}>
                    <div style={{
                        width: 48,
                        height: 48,
                        borderRadius: 12,
                        background: 'linear-gradient(135deg, #6366f1, #8b5cf6)',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        boxShadow: '0 0 30px rgba(99, 102, 241, 0.4)'
                    }}>
                        <span style={{fontSize: 24}}>🎯</span>
                    </div>
                    <div>
                        <h1 style={{
                            fontSize: 24,
                            fontWeight: 800,
                            background: 'linear-gradient(90deg, #fff, #9ca3af)',
                            WebkitBackgroundClip: 'text',
                            WebkitTextFillColor: 'transparent'
                        }}>Venice AI Marketing Scraper</h1>
                        <p style={{color: 'var(--text-muted)', fontSize: 14}}>5 Intelligent Agents • Powered by Venice AI</p>
                    </div>
                </div>
                <div style={{display: 'flex', gap: 12}}>
                    <a href="https://docs.venice.ai" target="_blank" style={{
                        padding: '10px 16px',
                        borderRadius: 8,
                        border: '1px solid var(--border)',
                        color: 'var(--text-secondary)',
                        textDecoration: 'none',
                        fontSize: 14,
                        transition: 'all 0.2s'
                    }}>API Docs</a>
                </div>
            </header>
        );
        
        // Agent Card Component
        const AgentCard = ({ agent, status, active }) => (
            <div style={{
                background: active ? `linear-gradient(135deg, ${agent.color}15, transparent)` : 'var(--bg-card)',
                border: `1px solid ${active ? agent.color : 'var(--border)'}`,
                borderRadius: 16,
                padding: 20,
                transition: 'all 0.3s',
                position: 'relative',
                overflow: 'hidden'
            }}>
                {active && (
                    <div style={{
                        position: 'absolute',
                        top: 0,
                        left: 0,
                        right: 0,
                        height: 3,
                        background: `linear-gradient(90deg, ${agent.color}, transparent)`,
                        animation: 'progress-pulse 1s infinite'
                    }}/>
                )}
                <div style={{display: 'flex', alignItems: 'center', gap: 12, marginBottom: 12}}>
                    <div style={{
                        width: 40,
                        height: 40,
                        borderRadius: 10,
                        background: `${agent.color}20`,
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        color: agent.color
                    }}>
                        <AgentIcon type={agent.key}/>
                    </div>
                    <div>
                        <h3 style={{fontSize: 14, fontWeight: 600}}>{agent.name}</h3>
                        <code style={{fontSize: 11, color: 'var(--text-muted)', fontFamily: 'JetBrains Mono'}}>{agent.model}</code>
                    </div>
                </div>
                <div style={{
                    display: 'flex',
                    alignItems: 'center',
                    gap: 8,
                    fontSize: 12,
                    color: active ? agent.color : status === 'complete' ? 'var(--success)' : 'var(--text-muted)'
                }}>
                    <span style={{
                        width: 8,
                        height: 8,
                        borderRadius: '50%',
                        background: active ? agent.color : status === 'complete' ? 'var(--success)' : 'var(--text-muted)',
                        animation: active ? 'pulse 1s infinite' : 'none'
                    }}/>
                    {active ? 'Processing...' : status === 'complete' ? 'Complete' : 'Ready'}
                </div>
            </div>
        );
        
        // Input Form Component
        const ScrapeForm = ({ onSubmit, loading }) => {
            const [targetProfile, setTargetProfile] = useState('');
            const [domains, setDomains] = useState('linkedin.com');
            const [userType, setUserType] = useState('');
            const [maxResults, setMaxResults] = useState(50);
            
            const handleSubmit = (e) => {
                e.preventDefault();
                onSubmit({
                    target_profile: targetProfile,
                    domains: domains.split(',').map(d => d.trim()).filter(Boolean),
                    user_type: userType,
                    max_results: maxResults
                });
            };
            
            return (
                <form onSubmit={handleSubmit} style={{
                    background: 'var(--bg-card)',
                    border: '1px solid var(--border)',
                    borderRadius: 20,
                    padding: 32
                }}>
                    <h2 style={{fontSize: 20, fontWeight: 700, marginBottom: 24, display: 'flex', alignItems: 'center', gap: 12}}>
                        <span style={{fontSize: 24}}>🔍</span> Configure Scraping Job
                    </h2>
                    
                    <div style={{marginBottom: 24}}>
                        <label style={{display: 'block', marginBottom: 8, color: 'var(--text-secondary)', fontSize: 14, fontWeight: 500}}>
                            Target Profile Description *
                        </label>
                        <textarea
                            value={targetProfile}
                            onChange={(e) => setTargetProfile(e.target.value)}
                            placeholder="e.g., Marketing managers in SaaS companies, CTOs at AI startups..."
                            required
                            style={{
                                width: '100%',
                                padding: 16,
                                borderRadius: 12,
                                border: '1px solid var(--border)',
                                background: 'var(--bg-secondary)',
                                color: 'var(--text-primary)',
                                fontSize: 15,
                                resize: 'vertical',
                                minHeight: 100,
                                fontFamily: 'inherit'
                            }}
                        />
                    </div>
                    
                    <div style={{marginBottom: 24}}>
                        <label style={{display: 'block', marginBottom: 8, color: 'var(--text-secondary)', fontSize: 14, fontWeight: 500}}>
                            Target Domains (comma-separated) *
                        </label>
                        <input
                            type="text"
                            value={domains}
                            onChange={(e) => setDomains(e.target.value)}
                            placeholder="linkedin.com, twitter.com"
                            required
                            style={{
                                width: '100%',
                                padding: 16,
                                borderRadius: 12,
                                border: '1px solid var(--border)',
                                background: 'var(--bg-secondary)',
                                color: 'var(--text-primary)',
                                fontSize: 15
                            }}
                        />
                    </div>
                    
                    <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24, marginBottom: 24}}>
                        <div>
                            <label style={{display: 'block', marginBottom: 8, color: 'var(--text-secondary)', fontSize: 14, fontWeight: 500}}>
                                User Type to Search
                            </label>
                            <select
                                value={userType}
                                onChange={(e) => setUserType(e.target.value)}
                                style={{
                                    width: '100%',
                                    padding: 16,
                                    borderRadius: 12,
                                    border: '1px solid var(--border)',
                                    background: 'var(--bg-secondary)',
                                    color: 'var(--text-primary)',
                                    fontSize: 15
                                }}
                            >
                                <option value="">All types</option>
                                <option value="Decision Makers">Decision Makers (C-level, VPs)</option>
                                <option value="Hiring Managers">Hiring Managers</option>
                                <option value="Technical Leads">Technical Leads</option>
                                <option value="Marketing Professionals">Marketing Professionals</option>
                                <option value="Sales Professionals">Sales Professionals</option>
                                <option value="Founders">Founders & Entrepreneurs</option>
                            </select>
                        </div>
                        
                        <div>
                            <label style={{display: 'block', marginBottom: 8, color: 'var(--text-secondary)', fontSize: 14, fontWeight: 500}}>
                                Max Results
                            </label>
                            <input
                                type="number"
                                value={maxResults}
                                onChange={(e) => setMaxResults(parseInt(e.target.value) || 50)}
                                min="10"
                                max="500"
                                style={{
                                    width: '100%',
                                    padding: 16,
                                    borderRadius: 12,
                                    border: '1px solid var(--border)',
                                    background: 'var(--bg-secondary)',
                                    color: 'var(--text-primary)',
                                    fontSize: 15
                                }}
                            />
                        </div>
                    </div>
                    
                    <button
                        type="submit"
                        disabled={loading || !targetProfile || !domains}
                        style={{
                            width: '100%',
                            padding: 18,
                            borderRadius: 12,
                            border: 'none',
                            background: loading ? 'var(--bg-secondary)' : 'linear-gradient(135deg, #6366f1, #8b5cf6)',
                            color: 'white',
                            fontSize: 16,
                            fontWeight: 600,
                            cursor: loading ? 'not-allowed' : 'pointer',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            gap: 12,
                            boxShadow: loading ? 'none' : '0 0 30px rgba(99, 102, 241, 0.3)',
                            transition: 'all 0.3s'
                        }}
                    >
                        {loading ? (
                            <>
                                <span style={{
                                    width: 20,
                                    height: 20,
                                    border: '2px solid transparent',
                                    borderTop: '2px solid white',
                                    borderRadius: '50%',
                                    animation: 'spin 1s linear infinite'
                                }}/>
                                Agents Working...
                            </>
                        ) : (
                            <>
                                <span>🚀</span> Start Scraping with 5 Agents
                            </>
                        )}
                    </button>
                    
                    <style>{`
                        @keyframes spin {
                            to { transform: rotate(360deg); }
                        }
                        @keyframes pulse {
                            0%, 100% { opacity: 1; }
                            50% { opacity: 0.5; }
                        }
                    `}</style>
                </form>
            );
        };
        
        // Results Component
        const Results = ({ data, onExport }) => {
            if (!data || !data.final_data) return null;
            
            const { final_data } = data;
            const profiles = final_data.export_ready_data || [];
            const stats = final_data.statistics || {};
            const segments = final_data.segments || {};
            
            return (
                <div style={{
                    background: 'var(--bg-card)',
                    border: '1px solid var(--border)',
                    borderRadius: 20,
                    padding: 32,
                    marginTop: 32
                }}>
                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24}}>
                        <h2 style={{fontSize: 20, fontWeight: 700, display: 'flex', alignItems: 'center', gap: 12}}>
                            <span style={{fontSize: 24}}>📊</span> Scraping Results
                        </h2>
                        <div style={{display: 'flex', gap: 12}}>
                            <button
                                onClick={() => onExport('excel')}
                                style={{
                                    padding: '12px 24px',
                                    borderRadius: 10,
                                    border: 'none',
                                    background: 'linear-gradient(135deg, #10b981, #059669)',
                                    color: 'white',
                                    fontSize: 14,
                                    fontWeight: 600,
                                    cursor: 'pointer',
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: 8
                                }}
                            >
                                📥 Export Excel
                            </button>
                            <button
                                onClick={() => onExport('csv')}
                                style={{
                                    padding: '12px 24px',
                                    borderRadius: 10,
                                    border: '1px solid var(--border)',
                                    background: 'transparent',
                                    color: 'var(--text-primary)',
                                    fontSize: 14,
                                    fontWeight: 600,
                                    cursor: 'pointer'
                                }}
                            >
                                📄 Export CSV
                            </button>
                        </div>
                    </div>
                    
                    {/* Stats Cards */}
                    <div style={{display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 16, marginBottom: 32}}>
                        <StatCard label="Total Profiles" value={stats.total_profiles || 0} color="#6366f1"/>
                        <StatCard label="With Email" value={stats.with_email || 0} color="#10b981"/>
                        <StatCard label="With Phone" value={stats.with_phone || 0} color="#06b6d4"/>
                        <StatCard label="Hot Leads" value={stats.hot_leads_count || 0} color="#ef4444"/>
                        <StatCard label="Avg Score" value={stats.average_lead_score || 0} color="#f59e0b"/>
                    </div>
                    
                    {/* Segment Pills */}
                    <div style={{display: 'flex', gap: 16, marginBottom: 24, flexWrap: 'wrap'}}>
                        <SegmentPill label="🔥 Hot" count={segments.hot_leads?.length || 0} color="var(--hot)"/>
                        <SegmentPill label="🌡️ Warm" count={segments.warm_leads?.length || 0} color="var(--warm)"/>
                        <SegmentPill label="❄️ Cold" count={segments.cold_leads?.length || 0} color="var(--cold)"/>
                        <SegmentPill label="👔 Decision Makers" count={segments.decision_makers?.length || 0} color="#8b5cf6"/>
                    </div>
                    
                    {/* Profiles Table */}
                    <div style={{
                        overflowX: 'auto',
                        borderRadius: 12,
                        border: '1px solid var(--border)'
                    }}>
                        <table style={{width: '100%', borderCollapse: 'collapse', fontSize: 14}}>
                            <thead>
                                <tr style={{background: 'var(--bg-secondary)'}}>
                                    <th style={{padding: 16, textAlign: 'left', fontWeight: 600}}>Name</th>
                                    <th style={{padding: 16, textAlign: 'left', fontWeight: 600}}>Title</th>
                                    <th style={{padding: 16, textAlign: 'left', fontWeight: 600}}>Company</th>
                                    <th style={{padding: 16, textAlign: 'left', fontWeight: 600}}>Email</th>
                                    <th style={{padding: 16, textAlign: 'center', fontWeight: 600}}>Score</th>
                                    <th style={{padding: 16, textAlign: 'center', fontWeight: 600}}>Category</th>
                                </tr>
                            </thead>
                            <tbody>
                                {profiles.slice(0, 20).map((profile, idx) => (
                                    <tr key={idx} style={{
                                        borderTop: '1px solid var(--border)',
                                        background: idx % 2 === 0 ? 'transparent' : 'rgba(255,255,255,0.02)'
                                    }}>
                                        <td style={{padding: 16, fontWeight: 500}}>{profile.name || '-'}</td>
                                        <td style={{padding: 16, color: 'var(--text-secondary)'}}>{profile.title || '-'}</td>
                                        <td style={{padding: 16, color: 'var(--text-secondary)'}}>{profile.company || '-'}</td>
                                        <td style={{padding: 16}}>
                                            {profile.email ? (
                                                <a href={`mailto:${profile.email}`} style={{color: 'var(--accent)'}}>{profile.email}</a>
                                            ) : '-'}
                                        </td>
                                        <td style={{padding: 16, textAlign: 'center'}}>
                                            <span style={{
                                                padding: '4px 12px',
                                                borderRadius: 20,
                                                background: `${getScoreColor(profile.lead_score)}20`,
                                                color: getScoreColor(profile.lead_score),
                                                fontSize: 13,
                                                fontWeight: 600
                                            }}>{profile.lead_score || 0}</span>
                                        </td>
                                        <td style={{padding: 16, textAlign: 'center'}}>
                                            <span style={{
                                                padding: '4px 12px',
                                                borderRadius: 20,
                                                background: getCategoryColor(profile.lead_category),
                                                color: 'white',
                                                fontSize: 12,
                                                fontWeight: 600,
                                                textTransform: 'uppercase'
                                            }}>{profile.lead_category || 'warm'}</span>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    
                    {profiles.length > 20 && (
                        <p style={{marginTop: 16, color: 'var(--text-muted)', textAlign: 'center', fontSize: 14}}>
                            Showing 20 of {profiles.length} profiles. Export to see all.
                        </p>
                    )}
                </div>
            );
        };
        
        // Helper Components
        const StatCard = ({ label, value, color }) => (
            <div style={{
                background: 'var(--bg-secondary)',
                borderRadius: 12,
                padding: 20,
                textAlign: 'center',
                border: `1px solid ${color}30`
            }}>
                <div style={{fontSize: 28, fontWeight: 700, color, marginBottom: 8}}>{value}</div>
                <div style={{fontSize: 12, color: 'var(--text-muted)', fontWeight: 500}}>{label}</div>
            </div>
        );
        
        const SegmentPill = ({ label, count, color }) => (
            <div style={{
                display: 'flex',
                alignItems: 'center',
                gap: 8,
                padding: '8px 16px',
                borderRadius: 20,
                background: `${color}20`,
                border: `1px solid ${color}40`
            }}>
                <span>{label}</span>
                <span style={{
                    background: color,
                    color: 'white',
                    padding: '2px 8px',
                    borderRadius: 10,
                    fontSize: 12,
                    fontWeight: 600
                }}>{count}</span>
            </div>
        );
        
        const getScoreColor = (score) => {
            if (score >= 70) return '#10b981';
            if (score >= 40) return '#f59e0b';
            return '#6b7280';
        };
        
        const getCategoryColor = (category) => {
            const c = (category || '').toLowerCase();
            if (c === 'hot') return '#ef4444';
            if (c === 'warm') return '#f59e0b';
            return '#3b82f6';
        };
        
        // Main App Component
        const App = () => {
            const [loading, setLoading] = useState(false);
            const [currentStage, setCurrentStage] = useState(null);
            const [agentStates, setAgentStates] = useState({});
            const [results, setResults] = useState(null);
            const [jobId, setJobId] = useState(null);
            const [logs, setLogs] = useState([]);
            const socketRef = useRef(null);
            
            useEffect(() => {
                // Initialize Socket.IO connection
                socketRef.current = io('http://localhost:5000');
                
                socketRef.current.on('connect', () => {
                    addLog('🔗 Connected to server');
                });
                
                socketRef.current.on('scrape_progress', (data) => {
                    addLog(`📡 ${data.stage}: ${data.data?.status || 'processing'}`);
                    setCurrentStage(data.stage);
                    setAgentStates(prev => ({...prev, [data.stage]: data.data?.status}));
                });
                
                socketRef.current.on('scrape_complete', (data) => {
                    addLog('✅ Scraping complete!');
                    setResults(data.result);
                    setLoading(false);
                    setCurrentStage(null);
                });
                
                socketRef.current.on('scrape_error', (data) => {
                    addLog(`❌ Error: ${data.error}`);
                    setLoading(false);
                    setCurrentStage(null);
                });
                
                return () => socketRef.current?.disconnect();
            }, []);
            
            const addLog = (msg) => {
                setLogs(prev => [...prev.slice(-50), {time: new Date().toLocaleTimeString(), msg}]);
            };
            
            const handleSubmit = async (formData) => {
                setLoading(true);
                setResults(null);
                setAgentStates({});
                addLog(`🚀 Starting scrape job: ${formData.target_profile}`);
                
                try {
                    const res = await fetch('http://localhost:5000/api/scrape', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(formData)
                    });
                    const data = await res.json();
                    
                    if (data.job_id) {
                        setJobId(data.job_id);
                        addLog(`📋 Job created: ${data.job_id}`);
                    } else {
                        throw new Error(data.error || 'Failed to start job');
                    }
                } catch (err) {
                    addLog(`❌ Error: ${err.message}`);
                    setLoading(false);
                }
            };
            
            const handleExport = async (format) => {
                if (!jobId) return;
                
                try {
                    const res = await fetch(`http://localhost:5000/api/jobs/${jobId}/export`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({format})
                    });
                    
                    if (res.ok) {
                        const blob = await res.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `marketing_leads.${format === 'csv' ? 'csv' : 'xlsx'}`;
                        a.click();
                        addLog(`📥 Exported ${format.toUpperCase()} file`);
                    }
                } catch (err) {
                    addLog(`❌ Export error: ${err.message}`);
                }
            };
            
            return (
                <div style={{minHeight: '100vh'}}>
                    <Header/>
                    
                    <main style={{maxWidth: 1400, margin: '0 auto', padding: '32px 48px'}}>
                        {/* Agent Status Cards */}
                        <div style={{
                            display: 'grid',
                            gridTemplateColumns: 'repeat(5, 1fr)',
                            gap: 16,
                            marginBottom: 32
                        }}>
                            {AGENTS.map((agent, idx) => (
                                <div key={agent.id} className={`animate-in stagger-${idx + 1}`}>
                                    <AgentCard 
                                        agent={agent}
                                        status={agentStates[agent.key] || 'ready'}
                                        active={currentStage?.includes(agent.key) || currentStage === `hunt_${agent.key}`}
                                    />
                                </div>
                            ))}
                        </div>
                        
                        <div style={{display: 'grid', gridTemplateColumns: '1fr 350px', gap: 32}}>
                            {/* Left: Form & Results */}
                            <div>
                                <ScrapeForm onSubmit={handleSubmit} loading={loading}/>
                                <Results data={results} onExport={handleExport}/>
                            </div>
                            
                            {/* Right: Live Logs */}
                            <div style={{
                                background: 'var(--bg-card)',
                                border: '1px solid var(--border)',
                                borderRadius: 20,
                                padding: 24,
                                height: 'fit-content',
                                position: 'sticky',
                                top: 100
                            }}>
                                <h3 style={{fontSize: 14, fontWeight: 600, marginBottom: 16, display: 'flex', alignItems: 'center', gap: 8}}>
                                    <span style={{color: 'var(--success)'}}>●</span> Live Agent Activity
                                </h3>
                                <div style={{
                                    fontFamily: 'JetBrains Mono',
                                    fontSize: 12,
                                    maxHeight: 400,
                                    overflowY: 'auto',
                                    background: 'var(--bg-secondary)',
                                    borderRadius: 12,
                                    padding: 16
                                }}>
                                    {logs.length === 0 ? (
                                        <div style={{color: 'var(--text-muted)'}}>Waiting for activity...</div>
                                    ) : (
                                        logs.map((log, idx) => (
                                            <div key={idx} style={{marginBottom: 8, lineHeight: 1.6}}>
                                                <span style={{color: 'var(--text-muted)'}}>{log.time}</span>
                                                <span style={{marginLeft: 8}}>{log.msg}</span>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
</body>
</html>
